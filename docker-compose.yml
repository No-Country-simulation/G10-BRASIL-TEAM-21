name: adaptai

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADAPTAI_ENV: ${ADAPTAI_ENV:-dev}
      ADAPTAI_MODO_DEMO: ${ADAPTAI_MODO_DEMO:-false}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRA_MIN: ${JWT_EXPIRA_MIN:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_DIR: ${LOCAL_STORAGE_DIR:-.local-storage}
      # (Mantenha as variáveis da OCI e LLM que já estavam aqui)
    volumes:
      - local_storage:/srv/.local-storage
      - ./backend:/srv
    expose:
      - "8000"

  frontend:
    build: ./frontend
    volumes:
      - frontend_dist:/usr/share/nginx/html
    # O frontend compila, copia os arquivos para o volume e "dorme"

  nginx:
    build: ./nginx
    ports:
      - "80:80" # A ÚNICA porta exposta
    depends_on:
      - backend
      - frontend
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro # Acesso apenas leitura aos arquivos

volumes:
  pgdata:
  local_storage:
  frontend_dist:
