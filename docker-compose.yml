# AdaptAI — stack local (ADR-0015). Suba com: docker compose up --build
# Pré-requisito: copiar .env.example para .env e preencher as variáveis obrigatórias.
name: adaptai

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADAPTAI_ENV: ${ADAPTAI_ENV:-dev}
      ADAPTAI_MODO_DEMO: ${ADAPTAI_MODO_DEMO:-false}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRA_MIN: ${JWT_EXPIRA_MIN:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_DIR: ${LOCAL_STORAGE_DIR:-.local-storage}
      OCI_REGION: ${OCI_REGION:-}
      OCI_TENANCY: ${OCI_TENANCY:-}
      OCI_USER: ${OCI_USER:-}
      OCI_FINGERPRINT: ${OCI_FINGERPRINT:-}
      OCI_KEY_FILE: ${OCI_KEY_FILE:-}
      OCI_NAMESPACE: ${OCI_NAMESPACE:-}
      OCI_BUCKET: ${OCI_BUCKET:-adaptai-conteudos-educativos}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-}
    volumes:
      - local_storage:/srv/.local-storage
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"

volumes:
  pgdata:
  local_storage:
