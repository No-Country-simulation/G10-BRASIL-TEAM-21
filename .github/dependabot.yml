version: 2

updates:
  - package-ecosystem: pip
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencias]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencias]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(infra)"
    labels: [dependencias]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    labels: [dependencias]
