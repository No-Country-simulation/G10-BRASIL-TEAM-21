server {
    listen 80;
    server_name localhost;

    # 1. Redirecionar chamadas de API para o Backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Redirecionar para o Frontend (Container React/Vite)
    location / {
        # O nome 'frontend' é o nome do serviço no docker-compose
        # A porta 5173 é o padrão do Vite (verifique se o seu container usa essa)
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Necessário para o WebSocket do Vite (HMR) funcionar atrás do Nginx
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
